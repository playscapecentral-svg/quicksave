<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QuickSave Helper</title>
<style>
  body{font-family:system-ui,sans-serif;width:320px;margin:0;padding:16px;color:#17202a}
  h1{font-size:17px;margin:0 0 4px} h1 span{color:#2f9e44}
  p{font-size:12.5px;color:#5d6b7a;margin:4px 0 10px}
  label{font-size:12px;font-weight:700;display:block;margin-top:10px}
  input{width:100%;box-sizing:border-box;padding:8px;border:1px solid #cfd8d2;border-radius:8px;font-size:13px;margin-top:4px}
  button{width:100%;margin-top:12px;background:#2f9e44;color:#fff;border:0;border-radius:999px;
    padding:9px;font-weight:700;font-size:14px;cursor:pointer}
  button.secondary{background:#17202a;margin-top:8px}
  #msg{font-size:12px;color:#26823a;min-height:15px;margin-top:8px}
</style>
</head>
<body>
  <h1><img src="download.svg" alt="" width="22" height="22" style="vertical-align:-4px"> Quick<span>Save</span> Helper</h1>
  <p>Paste any video link, or grab the current tab, and open it in QuickSave ready to download.</p>

  <label>Video link
    <input type="url" id="url" placeholder="https://www.youtube.com/watch?v=…">
  </label>
  <button id="open">Open in QuickSave</button>
  <button id="use-tab" class="secondary">Use current tab's link</button>

  <label>QuickSave server URL
    <input type="url" id="server" placeholder="http://127.0.0.1:5000">
  </label>
  <button id="save-server" class="secondary">Save server URL</button>
  <div id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
